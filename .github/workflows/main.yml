name: Update stats

on:
  schedule:
    # 06:17 UTC daily: picks up every weekend and midweek round the morning after
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sort files into folders
        run: |
          mkdir -p pipeline model site
          for f in extract.py xg_model.py fetch_basic.py fetch_live.py score_xg.py build_stats.py package_site.py; do
            if [ -f "$f" ]; then mv -f "$f" pipeline/; fi
          done
          for f in xg_model.joblib xg_report.json; do
            if [ -f "$f" ]; then mv -f "$f" model/; fi
          done
          for f in index.html data.json; do
            if [ -f "$f" ]; then mv -f "$f" site/; fi
          done
          ls -R pipeline model site
          if [ ! -f pipeline/fetch_basic.py ]; then echo "::error::fetch_basic.py is missing. Upload it to the repository."; exit 1; fi
          if [ ! -f pipeline/package_site.py ]; then echo "::error::package_site.py is missing. Upload it to the repository."; exit 1; fi
          if ! grep -q "live.json" site/index.html; then echo "::error::index.html is the old version. Upload the new index.html."; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas numpy scikit-learn joblib

      - name: Fetch this season's table, results and scorers (free plan)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python pipeline/fetch_basic.py site/live.json

      # The steps below only run once you add a paid provider (set the DATA_API_BASE variable).
      - uses: actions/cache@v4
        if: ${{ vars.DATA_API_BASE != '' }}
        with:
          path: cache
          key: provider-cache-${{ github.run_id }}
          restore-keys: provider-cache-

      - name: Fetch new matches with shot data (paid plan)
        if: ${{ vars.DATA_API_BASE != '' }}
        env:
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
          DATA_API_BASE: ${{ vars.DATA_API_BASE }}
          SEASON: ${{ vars.SEASON }}
        run: python pipeline/fetch_live.py data

      - name: Score shots with the Touchline xG model
        if: ${{ vars.DATA_API_BASE != '' }}
        run: python pipeline/score_xg.py data model/xg_model.joblib

      - name: Build full stats
        if: ${{ vars.DATA_API_BASE != '' }}
        run: python pipeline/build_stats.py data site/data.json "${{ vars.SEASON_LABEL }}"

      - name: Package site
        run: python pipeline/package_site.py dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
